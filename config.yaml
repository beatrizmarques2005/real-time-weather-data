# Assignment card PA48 (Guidelines, Chapter 19).
assignment:
  code: PA48
  group: GroupYY        # TODO: replace YY with the Moodle group number (used in submission file names)
  business_context: "Outdoor Running Event Organiser"
  business_question: "Which city offers more reliable weather windows for recurring outdoor races?"
  target: T6            # Adverse Outdoor Event: rain (P >= 0.1 mm) OR strong wind (W >= pooled warm-up Q0.80)

cities:
  city_a:               # Student A - Beatriz Marques
    name: "Angra do Heroismo"
    latitude: 38.6539
    longitude: -27.21839
    local_timezone: "Atlantic/Azores"   # used only to describe local race hours (analysis)
  city_b:               # Student B - Duarte Fernandes
    name: "Braga"
    latitude: 41.5514
    longitude: -8.42311
    local_timezone: "Europe/Lisbon"

period:
  start_date: "2021-01-01"
  end_date: "2026-09-30"
  timezone: "UTC"       # UTC aligns both streams (Azores is UTC-1 vs mainland) and avoids DST duplicates/gaps

warmup:
  n_hours: 720          # first 30 days: threshold estimation + initial learning, not scored

features:
  windows: [6, 24]

evaluation:
  window_size: 168      # recent-performance window: last 168 evaluated predictions = 1 week of hourly events
  track_memory: false   # tracemalloc peak memory (slows the run; turn on for the computational section)

analysis:                # descriptive stream analysis + original analyses (src/stream_analysis.py)
  race_window:
    start_hour: 8         # local time; typical morning road-race slot (start + finish)
    n_hours: 4            # 08:00-12:00 local
  extremes:               # reported, never removed (Guidelines Ch. 9)
    wind_kmh: 40
    precip_mm: 5

baselines:
  include: true         # reference learners - NOT part of the five mandatory models

seed: 42

students:
  - name: "Beatriz Marques"
    number: "20231605"
    primary_city: "Angra do Heroismo"
  - name: "Duarte Fernandes"
    number: "20231619"
    primary_city: "Braga"

paths:
  data_url: https://archive-api.open-meteo.com/v1/archive
  raw_data: data/raw
  results: results

hourly_vars:
  temperature_2m: "temperature"
  relative_humidity_2m: "relative_humidity"
  precipitation: "precipitation"
  wind_speed_10m: "wind_speed"

targets:
  rain_threshold_mm: 0.1
  definitions:
    T1:
      type: "threshold"
      variable: "precipitation"
      threshold: 0.1
      operator: ">="
    T2:
      type: "quantile"
      variable: "temperature"
      quantile: 0.80
      operator: ">="
    T3:
      type: "quantile"
      variable: "temperature"
      quantile: 0.20
      operator: "<="
    T4:
      type: "quantile"
      variable: "relative_humidity"
      quantile: 0.50
      operator: ">="
    T5:
      type: "quantile"
      variable: "wind_speed"
      quantile: 0.80
      operator: ">="
    T6:
      type: "composite_or"
      rules:
        - variable: "precipitation"
          type: "threshold"
          threshold: 0.1
          operator: ">="
        - variable: "wind_speed"
          type: "quantile"
          quantile: 0.80
          operator: ">="